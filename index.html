<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushma's Album</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-400 bg-clip-text text-transparent">
                    Mom's Album 💖
                </h1>
                <p class="text-xs text-slate-400">Sushma's personal memory stash</p>
            </div>
            <button onclick="toggleAddModal()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                <i class="fa-solid fa-plus"></i> Add Memory
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow">
        <!-- Filter Tabs -->
        <div id="filter-bar" class="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button onclick="filterCategory('All')" class="category-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-pink-600 text-white">All</button>
            <button onclick="filterCategory('Family')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Family</button>
            <button onclick="filterCategory('Trips')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Trips</button>
            <button onclick="filterCategory('Special')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Special Days</button>
        </div>

        <!-- Album Cards Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Dynamic Cards -->
        </div>
    </main>

    <!-- Add Entry Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-md w-full relative">
            <h3 class="text-lg font-bold text-slate-100 mb-4">Add a New Memory Card</h3>
            <form id="add-form" onsubmit="handleAdd(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Title / Caption</label>
                    <input type="text" id="entry-title" required placeholder="e.g. Goa Beach Sunset" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
                    <select id="entry-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                        <option value="Family">Family</option>
                        <option value="Trips">Trips</option>
                        <option value="Special">Special Days</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Note / Description</label>
                    <textarea id="entry-desc" rows="3" placeholder="Write a quick note about this day..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleAddModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800">Cancel</button>
                    <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-lg text-xs font-medium">Save Memory</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let memories = [
            { id: 1, title: 'Goa Trip Highlights', category: 'Trips', desc: 'Awesome evening spent near the beach catching the sunset.', date: 'May 2026' },
            { id: 2, title: 'Family Dinner Night', category: 'Family', desc: 'Had a great feast together at home.', date: 'April 2026' },
            { id: 3, title: 'Birthday Celebration', category: 'Special', desc: 'Cake cutting and fun times with everyone.', date: 'Dec 2025' }
        ];

        let activeCategory = 'All';

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            const filtered = activeCategory === 'All' 
                ? memories 
                : memories.filter(m => m.category === activeCategory);

            if(filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12 text-sm">Nothing added in this section yet!</p>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg hover:border-slate-700 transition flex flex-col justify-between';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-pink-400 bg-pink-950/40 px-2 py-0.5 rounded">${item.category}</span>
                            <span class="text-[11px] text-slate-500">${item.date || ''}</span>
                        </div>
                        <h4 class="text-base font-semibold text-slate-100 mb-2">${item.title}</h4>
                        <p class="text-xs text-slate-400 leading-relaxed">${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.innerText === cat) {
                    btn.className = 'category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-pink-600 text-white';
                } else {
                    btn.className = 'category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700';
                }
            });
            renderGallery();
        }

        function toggleAddModal() {
            const modal = document.getElementById('add-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function handleAdd(e) {
            e.preventDefault();
            const title = document.getElementById('entry-title').value;
            const category = document.getElementById('entry-category').value;
            const desc = document.getElementById('entry-desc').value;

            memories.unshift({
                id: Date.now(),
                title,
                category,
                desc,
                date: 'Just now'
            });

            toggleAddModal();
            document.getElementById('add-form').reset();
            renderGallery();
        }

        renderGallery();
    </script>
</body>
</html>
